<div class="container-fluid py-2">
  <div class="mb-4">
    <a routerLink="/services" class="text-teal text-decoration-none fw-semibold small">
      <i class="bi bi-arrow-left me-1"></i> Back to Services
    </a>
    <h2 class="fw-bold mt-2 mb-1 text-dark">{{ isEditMode ? 'Edit Dental Service' : 'Add New Dental Service' }}</h2>
    <p class="text-muted mb-0">Specify treatment procedure name, estimated consultation duration, and pricing</p>
  </div>

  <div *ngIf="errorMsg" class="alert alert-danger border-0 shadow-sm mb-3">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMsg }}
  </div>
  <div *ngIf="successMsg" class="alert alert-success border-0 shadow-sm mb-3">
    <i class="bi bi-check-circle-fill me-2"></i> {{ successMsg }}
  </div>

  <div class="row">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card card-custom border-0 p-4 bg-white">
        <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Service / Treatment Name *</label>
            <input type="text" class="form-control" formControlName="name" placeholder="e.g. Ultrasonic Dental Cleaning"
                   [class.is-invalid]="serviceForm.get('name')?.touched && serviceForm.get('name')?.invalid">
            <div class="invalid-feedback">Service name is required.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small">Description</label>
            <textarea class="form-control" rows="3" formControlName="description"
                      placeholder="Brief description of the procedure and pre-requisites..."></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold small">Duration (Minutes) *</label>
              <div class="input-group">
                <input type="number" class="form-control" formControlName="durationMinutes" min="5" step="5"
                       [class.is-invalid]="serviceForm.get('durationMinutes')?.touched && serviceForm.get('durationMinutes')?.invalid">
                <span class="input-group-text bg-light">mins</span>
                <div class="invalid-feedback">Duration must be positive.</div>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold small">Price ($) *</label>
              <div class="input-group">
                <span class="input-group-text bg-light">$</span>
                <input type="number" class="form-control" formControlName="price" min="0" step="0.5"
                       [class.is-invalid]="serviceForm.get('price')?.touched && serviceForm.get('price')?.invalid">
                <div class="invalid-feedback">Price must be a valid amount.</div>
              </div>
            </div>
          </div>

          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="serviceActiveSwitch" formControlName="isActive">
            <label class="form-check-label small fw-semibold" for="serviceActiveSwitch">Active for Online Booking</label>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary bg-teal-gradient border-0 px-4 py-2" [disabled]="submitting">
              <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!submitting" class="bi bi-check2 me-1"></i>
              {{ isEditMode ? 'Update Service' : 'Create Service' }}
            </button>
            <a routerLink="/services" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
