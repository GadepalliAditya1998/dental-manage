databaseChangeLog:
  # ── 1. Create api_keys table ───────────────────────────────────────────────
  - changeSet:
      id: 011-create-api-keys-table
      author: system
      changes:
        - createTable:
            tableName: api_keys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: clinic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_api_keys_clinic
                    references: clinic_details(id)
              - column:
                  name: key_name
                  type: VARCHAR(100)
                  defaultValue: "Retell AI Voice Agent"
                  constraints:
                    nullable: false
              - column:
                  name: api_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: agent_type
                  type: VARCHAR(50)
                  defaultValue: "RETELL_AGENT"
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: last_used_at
                  type: TIMESTAMP
              # BaseEntity audit fields
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false
              - column:
                  name: modified_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false

  # ── 2. Create indexes for api_keys ─────────────────────────────────────────
  - changeSet:
      id: 011-create-api-keys-indexes
      author: system
      changes:
        - createIndex:
            tableName: api_keys
            indexName: idx_api_keys_clinic_id
            columns:
              - column:
                  name: clinic_id
        - createIndex:
            tableName: api_keys
            indexName: idx_api_keys_lookup
            columns:
              - column:
                  name: api_key
              - column:
                  name: is_active
              - column:
                  name: is_deleted
        - createIndex:
            tableName: api_keys
            indexName: idx_api_keys_agent_type
            columns:
              - column:
                  name: agent_type

  # ── 3. Seed sample active API key for clinicId 1 dedicated to Retell agent ──
  - changeSet:
      id: 011-seed-sample-retell-api-key-clinic-1
      author: system
      changes:
        - insert:
            tableName: api_keys
            columns:
              - column:
                  name: clinic_id
                  valueNumeric: 1
              - column:
                  name: key_name
                  value: "Retell AI Voice Agent"
              - column:
                  name: api_key
                  value: "retell_live_clinic_1_sk_sample_key_2026"
              - column:
                  name: agent_type
                  value: "RETELL_AGENT"
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: is_deleted
                  valueBoolean: false
              - column:
                  name: created_by
                  value: "SYSTEM"
              - column:
                  name: modified_by
                  value: "SYSTEM"
        - insert:
            tableName: api_keys
            columns:
              - column:
                  name: clinic_id
                  valueNumeric: 1
              - column:
                  name: key_name
                  value: "Smile Dental Default Retell Key"
              - column:
                  name: api_key
                  value: "clk_live_default_smile_dental_key_2026"
              - column:
                  name: agent_type
                  value: "RETELL_AGENT"
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: is_deleted
                  valueBoolean: false
              - column:
                  name: created_by
                  value: "SYSTEM"
              - column:
                  name: modified_by
                  value: "SYSTEM"
