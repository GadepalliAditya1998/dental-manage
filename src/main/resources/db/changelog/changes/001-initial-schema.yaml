databaseChangeLog:
  # ── ClinicDetails ──────────────────────────────────────────────────────────────
  - changeSet:
      id: 001-create-clinic-details
      author: system
      changes:
        - createTable:
            tableName: clinic_details
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: clinic_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: clinic_phone
                  type: VARCHAR(20)
              - column:
                  name: receptionist_phone
                  type: VARCHAR(20)
              - column:
                  name: opening_time
                  type: TIME
              - column:
                  name: closing_time
                  type: TIME
              - column:
                  name: working_days
                  type: VARCHAR(100)
                  defaultValue: "MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY"
              - column:
                  name: retell_agent_id
                  type: VARCHAR(255)
              - column:
                  name: timezone
                  type: VARCHAR(50)
                  defaultValue: "Asia/Kolkata"
              # Audit fields
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false
              - column:
                  name: modified_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false

  # ── Patients ───────────────────────────────────────────────────────────────────
  - changeSet:
      id: 001-create-patients
      author: system
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: is_new_lead
                  type: BOOLEAN
                  defaultValueBoolean: true
              # Audit fields
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false
              - column:
                  name: modified_on
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: VARCHAR(255)
                  defaultValue: "SYSTEM"
                  constraints:
                    nullable: false
        - createIndex:
            tableName: patients
            indexName: idx_patients_phone_number
            columns:
              - column:
                  name: phone_number

