              - column:
                  name: clinic_id
        - createIndex:
            tableName: call_metrics
            indexName: idx_call_metrics_clinic_id
            columns:
              - column:
                  name: clinic_id
        - createIndex:
            tableName: doctor_availabilities
            indexName: idx_doctor_availabilities_clinic_id
            columns:
              - column:
